map $host $slopper_app {
  default "";
  ~^([a-z0-9][a-z0-9-]*)\.slopper\. $1;
}

server {
  listen 80 default_server;
  server_name _;
  root /srv/slopper/$slopper_app/current;
  index index.html;
  autoindex off;
  if ($slopper_app = "") { return 404; }
  location ~ "(^|/)\." { return 404; }
  location ~* "\.[a-f0-9]{8,}\.(js|css|woff2?|png|svg|webp|avif)$" { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location ~* "\.(js|css|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot)$" { try_files $uri =404; }
  location ~* "\.[^/]+$" { try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
