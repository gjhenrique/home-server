services:
  postgres:
    image: ghcr.io/insforge/postgres:v15.13.4
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "cron.database_name=${POSTGRES_DB}", "-c", "app.encryption_key=${ENCRYPTION_KEY}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${SLOPPER_DATA}/postgres:/var/lib/postgresql/data
      - ./insforge/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./insforge/jwt.sql:/docker-entrypoint-initdb.d/02-jwt.sql:ro
      - ./insforge/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks: [insforge]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  postgrest:
    image: postgrest/postgrest:v12.2.12
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_POOL: 20
    depends_on: {postgres: {condition: service_healthy}}
    networks: [insforge]
    restart: unless-stopped
  insforge:
    # InsForge v2.3.5, pinned to the inspected image digest.
    image: ghcr.io/insforge/insforge-oss@sha256:261242c80e03ba3157560c0ab71fc0ee10ef07500e3fa5c240626384f3f84042
    working_dir: /app
    depends_on: {postgres: {condition: service_healthy}, postgrest: {condition: service_started}}
    ports: ["127.0.0.1:7133:7130", "127.0.0.1:7131:7131"]
    environment:
      PORT: 7130
      PROJECT_ROOT: /app
      API_BASE_URL: https://admin.slopper.${DOMAIN}
      VITE_API_BASE_URL: https://admin.slopper.${DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ROOT_ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGREST_BASE_URL: http://postgrest:3000
      ACCESS_API_KEY: ${ACCESS_API_KEY}
      ACCESS_ANON_KEY: ${ACCESS_ANON_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      S3_USE_PRESIGNED_URLS: "false"
      S3_MAX_OBJECT_SIZE_BYTES: "104857600"
      MAX_FILE_SIZE: "104857600"
      INSFORGE_TELEMETRY_DISABLED: "1"
      LOGS_DIR: /insforge-logs
      STORAGE_DIR: /insforge-storage
      COMPUTE_PROVIDER: ""
      DENO_RUNTIME_URL: ""
    volumes:
      - ${SLOPPER_DATA}/storage:/insforge-storage
      - ${SLOPPER_DATA}/logs:/insforge-logs
    networks: [insforge]
    restart: unless-stopped
networks:
  insforge:
    name: slopper-insforge
    driver: bridge
