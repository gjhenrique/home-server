---
services:
  mc-monitor:
    image: itzg/mc-monitor:1.21.0
    command: ["export-for-prometheus", "--timeout", "5s"]
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      # Comma-separated Java endpoints with explicit TCP ports.
      EXPORT_SERVERS: ${MINECRAFT_MONITOR_SERVERS:?Set MINECRAFT_MONITOR_SERVERS in Komodo}
    ports:
      - "127.0.0.1:9225:8080/tcp"
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/address: "127.0.0.1:9225"
      prometheus.io/path: "/metrics"
