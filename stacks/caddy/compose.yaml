---
services:
  caddy:
    image: ghcr.io/gjhenrique/home-server/caddy:9992042
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Berlin
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SHARED_KEY=${JWT_SHARED_KEY}
      - DOMAIN=${DOMAIN}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      # PMQ: fail closed until the Komodo secrets are configured.
      - PMQ_ALLOWED_EMAILS=${PMQ_ALLOWED_EMAILS:-nobody@pmq.invalid}
      - PMQ_OPERATOR_CIDRS=${PMQ_OPERATOR_CIDRS:-0.0.0.0/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${EXT_PATH}/caddy/data:/data
      - ${EXT_PATH}/caddy/config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - NET_ADMIN
