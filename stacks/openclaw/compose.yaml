---
# OpenClaw gateway: AI agent with WhatsApp, Telegram, OpenRouter.
# Image: ghcr.io/openclaw/openclaw (pin tag; digest optional for reproducibility)
# Docs: https://docs.openclaw.ai/install/docker
# After bumping the image, update @openclaw/whatsapp to the same version (see README).

x-openclaw-image: &openclaw-image ghcr.io/openclaw/openclaw:2026.8.1

x-openclaw-env: &openclaw-env
  HOME: /home/node
  OPENCLAW_HOME: /home/node
  TERM: xterm-256color
  # Pin container paths so host paths from Komodo/.env cannot leak (#77436).
  OPENCLAW_STATE_DIR: /home/node/.openclaw
  OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
  OPENCLAW_CONFIG_DIR: /home/node/.openclaw
  OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  TZ: ${TZ:-Europe/Berlin}
  # Bonjour/mDNS usually fails on bridge networks; empty = auto-disable in containers.
  OPENCLAW_DISABLE_BONJOUR: ${OPENCLAW_DISABLE_BONJOUR:-1}

x-openclaw-volumes: &openclaw-volumes
  - ${EXT_PATH}/openclaw/config:/home/node/.openclaw
  - ${EXT_PATH}/openclaw/workspace:/home/node/.openclaw/workspace
  - ${EXT_PATH}/openclaw/auth-secrets:/home/node/.config/openclaw

services:
  openclaw-gateway:
    image: *openclaw-image
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18789:18789"
      - "127.0.0.1:18790:18790"
    environment: *openclaw-env
    volumes: *openclaw-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # Foreground gateway (PID 1 child under tini). Do not use `gateway start` (systemd).
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - lan
      - --port
      - "18789"
    healthcheck:
      test:
        - CMD
        - node
        - dist/docker-healthcheck.js
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      caddy: openclaw.${DOMAIN}
      caddy.import: sso
      caddy.reverse_proxy: "127.0.0.1:18789"
      # OpenClaw 2026.8.1 rejects proxied UI traffic unless X-Forwarded-For is
      # overwritten with the real client (not appended/loopback). Docker NAT
      # makes Caddy appear as the bridge gateway (e.g. 192.168.144.1).
      caddy.reverse_proxy.header_up: "X-Forwarded-For {http.request.remote.host}"
      caddy.reverse_proxy.header_up_1: "X-Forwarded-Proto {scheme}"
      caddy.reverse_proxy.header_up_2: "X-Forwarded-Host {host}"
      homepage.group: AI and automation
      homepage.name: OpenClaw
      homepage.icon: openclaw
      homepage.href: https://openclaw.${DOMAIN}
      homepage.description: AI agent (WhatsApp, Telegram, OpenRouter)

  # One-off CLI (channels, plugins, doctor). Shares the gateway network namespace.
  # Komodo `up -d` ignores this profile; use: docker compose --profile cli run --rm openclaw-cli ...
  openclaw-cli:
    image: *openclaw-image
    profiles: ["cli"]
    network_mode: "service:openclaw-gateway"
    environment:
      <<: *openclaw-env
      BROWSER: echo
    volumes: *openclaw-volumes
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

