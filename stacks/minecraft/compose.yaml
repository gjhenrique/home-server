---
services:
  minecraft:
    image: itzg/minecraft-server:2026.11.1-java25
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      VERSION: "26.3"
      TYPE: VANILLA
      EULA: "TRUE"
      # Container root maps to the user running rootless Docker.
      UID: "0"
      GID: "0"
      MEMORY: 1G
      ONLINE_MODE: "true"
      ENABLE_WHITELIST: "true"
      EXISTING_WHITELIST_FILE: SKIP
    ports:
      - "192.168.1.219:25565:25565/tcp"
    volumes:
      - type: bind
        source: /mnt/tank/minecraft
        target: /data
        bind:
          create_host_path: false

  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.2@sha256:602c70efcb0ded80aa7e92209974304cf9d1d7d435d968cf9b34f34696052ec7
    restart: unless-stopped
    environment:
      SECRET_KEY: ${MINECRAFT_PLAYIT_SECRET_KEY:?Set the MINECRAFT_PLAYIT_SECRET_KEY Komodo secret}
    networks:
      - playit

  mc-monitor:
    image: itzg/mc-monitor:1.21.0
    command: ["export-for-prometheus", "--timeout", "5s"]
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      # Comma-separated Java endpoints with explicit TCP ports.
      EXPORT_SERVERS: ${MINECRAFT_MONITOR_SERVERS:-192.168.1.219:25565}
    ports:
      - "127.0.0.1:9225:8080/tcp"
    networks:
      - monitor

networks:
  playit:
    driver: bridge
  monitor:
    driver: bridge
