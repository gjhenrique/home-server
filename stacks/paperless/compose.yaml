---
services:
  broker:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - ${EXT_PATH}/documents/redis:/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
    restart: unless-stopped
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      - broker
      - gotenberg
      - tika
    volumes:
      - ${EXT_PATH}/documents/data:/usr/src/paperless/data
      - ${EXT_PATH}/documents/media:/usr/src/paperless/media
      - ${EXT_PATH}/documents/export:/usr/src/paperless/export
      - ${EXT_PATH}/documents/consume:/usr/src/paperless/consume
      - ${EXT_PATH}/documents/temporary:/temporary
    environment:
      PAPERLESS_URL: "${PAPERLESS_URL}"
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_OCR_LANGUAGES: "deu eng"
      # Some scanner PDFs make ghostscript's PDF/A conversion fail hard
      # (Error: /undefined in --runpdf--); store them anyway
      PAPERLESS_OCR_USER_ARGS: '{"continue_on_soft_render_error": true}'
      PAPERLESS_ENABLE_HTTP_REMOTE_USER: true
      PAPERLESS_ENABLE_HTTP_REMOTE_USER_API: true
      PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME: HTTP_X_TOKEN_USER_EMAIL
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: true
      # Trust proxy so X-Forwarded-For is used; required when behind Caddy so API token login works
      PAPERLESS_TRUSTED_PROXIES: "127.0.0.1 172.17.0.0/16 172.18.0.0/16"
      # Tika/Gotenberg parse eml files from the IMAP integration
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    labels:
      caddy: docs.${DOMAIN}
      caddy.import: ${PAPERLESS_CADDY_IMPORT:-only_tls}
      caddy.reverse_proxy: "127.0.0.1:8000"
      homepage.group: Documents
      homepage.name: Paperless
      homepage.icon: paperless-ngx
      homepage.href: https://docs.${DOMAIN}
      homepage.description: Document management

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.34.0
    restart: unless-stopped
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    image: docker.io/apache/tika:3.3.1.0
    restart: unless-stopped

  # paperless takes some minutes to index the scanned file
  # but sometimes I just want a document right away
  # serve it on a caddy server and delete older files on cleanup-old-documents service
  # a while true is not very scalable, but it will probably do the job
  # if not, ofelia FTW
  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - 127.0.0.1:8001:8080
    volumes:
      - ${EXT_PATH}/documents/temporary:/temporary
      - ${EXT_PATH}/documents/caddy_data:/data
      - ${EXT_PATH}/documents/caddy_config:/config
    command: caddy file-server --root /temporary --listen :8080 --browse
    labels:
      caddy: scan.${DOMAIN}
      caddy.import: ${PAPERLESS_CADDY_IMPORT:-only_tls}
      caddy.reverse_proxy: "127.0.0.1:8001"

  cleanup-old-documents:
    image: alpine:latest
    restart: unless-stopped
    volumes:
      - ${EXT_PATH}/documents/temporary:/temporary
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Starting cleanup of files older than 1 day..."
          find /temporary -type f -mmin +1440 -print -delete | while read file; do
            echo "  Deleted: $$file"
          done
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Cleanup complete. Sleeping for 24 hours..."
          sleep 86400
        done
